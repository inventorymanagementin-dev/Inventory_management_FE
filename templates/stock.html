{% extends 'base.html' %}

{% block title %}Stock Management | Inventory Management System{% endblock %}
{% block page_title %}Stock In / Out{% endblock %}

{% block content %}
<div class="space-y-6" x-data="stockApp()" x-init="initData()" x-cloak>
    
    <!-- Tabs and Forms Container -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden relative">
        <!-- Loading Overlay -->
        <div x-show="loading" class="absolute inset-0 bg-white/50 dark:bg-slate-900/50 z-10 flex items-center justify-center backdrop-blur-sm">
            <svg class="animate-spin h-8 w-8 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </div>

        <!-- Tabs Header -->
        <div class="flex border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50">
            <button @click="tab = 'in'" :class="tab === 'in' ? 'border-success text-success bg-white dark:bg-slate-800' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700'" class="flex-1 py-4 px-6 text-center border-b-2 font-medium text-sm transition-all flex items-center justify-center focus:outline-none">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11l5-5m0 0l5 5m-5-5v12" /></svg>
                Stock In (Receive)
            </button>
            <button @click="tab = 'out'" :class="tab === 'out' ? 'border-danger text-danger bg-white dark:bg-slate-800' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700'" class="flex-1 py-4 px-6 text-center border-b-2 font-medium text-sm transition-all flex items-center justify-center focus:outline-none">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 13l-5 5m0 0l-5-5m5 5V6" /></svg>
                Stock Out (Dispatch)
            </button>
        </div>

        <!-- Form Container -->
        <div class="p-6 md:p-8">
            
            <!-- Stock IN Form -->
            <form @submit.prevent="submitTransaction('IN')" x-show="tab === 'in'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-6">
                <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Select Product</label>
                        <select x-model="inForm.product_id" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl focus:ring-2 focus:ring-success/20 focus:border-success dark:focus:border-success transition-colors">
                            <option value="">Search or select product...</option>
                            <template x-for="product in products" :key="product._id || product.id">
                                <option :value="product._id || product.id" x-text="`${product.name} (${product.sku}) - ${product.quantity_in_stock} in stock`"></option>
                            </template>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Quantity Received</label>
                        <input type="number" x-model.number="inForm.quantity" min="1" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl focus:ring-2 focus:ring-success/20 focus:border-success dark:focus:border-success transition-colors placeholder-slate-400 dark:placeholder-slate-500" placeholder="0">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Reference (PO / Invoice)</label>
                        <input type="text" x-model="inForm.reference" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl focus:ring-2 focus:ring-success/20 focus:border-success dark:focus:border-success transition-colors placeholder-slate-400 dark:placeholder-slate-500" placeholder="Optional reference...">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Remarks / Note</label>
                        <textarea x-model="inForm.notes" rows="2" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl focus:ring-2 focus:ring-success/20 focus:border-success dark:focus:border-success transition-colors placeholder-slate-400 dark:placeholder-slate-500" placeholder="Optional notes about this shipment..."></textarea>
                    </div>
                </div>

                <div class="flex justify-end pt-4 border-t border-slate-100 dark:border-slate-700">
                    <button type="submit" :disabled="submitting" class="inline-flex items-center justify-center px-6 py-2.5 text-sm font-medium text-white bg-success rounded-xl hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-success/50 transition-all shadow-lg shadow-success/30 disabled:opacity-50">
                        <svg x-show="submitting" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        <svg x-show="!submitting" class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                        Confirm Stock In
                    </button>
                </div>
            </form>

            <!-- Stock OUT Form -->
            <form @submit.prevent="submitTransaction('OUT')" x-show="tab === 'out'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-6" x-cloak>
                <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Select Product</label>
                        <select x-model="outForm.product_id" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl focus:ring-2 focus:ring-danger/20 focus:border-danger dark:focus:border-danger transition-colors">
                            <option value="">Search or select product...</option>
                            <template x-for="product in products" :key="product._id || product.id">
                                <option :value="product._id || product.id" x-text="`${product.name} (${product.sku}) - ${product.quantity_in_stock} in stock`"></option>
                            </template>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Quantity to Remove</label>
                        <input type="number" x-model.number="outForm.quantity" min="1" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl focus:ring-2 focus:ring-danger/20 focus:border-danger dark:focus:border-danger transition-colors placeholder-slate-400 dark:placeholder-slate-500" placeholder="0">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Reference / Order ID</label>
                        <input type="text" x-model="outForm.reference" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl focus:ring-2 focus:ring-danger/20 focus:border-danger dark:focus:border-danger transition-colors placeholder-slate-400 dark:placeholder-slate-500" placeholder="e.g. ORD-10293">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Remarks / Note</label>
                        <textarea x-model="outForm.notes" rows="2" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl focus:ring-2 focus:ring-danger/20 focus:border-danger dark:focus:border-danger transition-colors placeholder-slate-400 dark:placeholder-slate-500" placeholder="Optional notes..."></textarea>
                    </div>
                </div>

                <div class="flex justify-end pt-4 border-t border-slate-100 dark:border-slate-700">
                    <button type="submit" :disabled="submitting" class="inline-flex items-center justify-center px-6 py-2.5 text-sm font-medium text-white bg-danger rounded-xl hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-danger/50 transition-all shadow-lg shadow-danger/30 disabled:opacity-50">
                        <svg x-show="submitting" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        <svg x-show="!submitting" class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                        Confirm Stock Out
                    </button>
                </div>
            </form>

        </div>
    </div>

    <!-- Transaction History -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden relative">
        <div class="px-6 py-5 border-b border-slate-100 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <h3 class="text-lg font-semibold text-slate-800 dark:text-white">Recent Transactions</h3>
            
            <div class="flex items-center gap-3">
                <select x-model="filterType" class="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-sm rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary dark:focus:border-primary transition-colors">
                    <option value="">All Types</option>
                    <option value="IN">Stock In</option>
                    <option value="OUT">Stock Out</option>
                </select>
            </div>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider border-b border-slate-100 dark:border-slate-700">
                        <th class="px-6 py-4 font-semibold">Date & Time</th>
                        <th class="px-6 py-4 font-semibold">Product</th>
                        <th class="px-6 py-4 font-semibold">Type</th>
                        <th class="px-6 py-4 font-semibold">Quantity</th>
                        <th class="px-6 py-4 font-semibold">Reference</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-700">
                    <template x-for="txn in filteredTransactions" :key="txn._id || txn.id">
                        <tr class="hover:bg-slate-50/80 dark:hover:bg-slate-700/50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400" x-text="formatDate(txn.date)"></td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm font-medium text-slate-900 dark:text-white" x-text="txn.product_id?.name || 'Unknown Product'"></div>
                                <div class="text-xs text-slate-500 dark:text-slate-400" x-text="txn.product_id?.sku || 'Unknown SKU'"></div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <template x-if="txn.transaction_type === 'IN'">
                                    <span class="px-2.5 py-1 rounded-full text-xs font-medium bg-success/10 text-success border border-success/20">Stock In</span>
                                </template>
                                <template x-if="txn.transaction_type === 'OUT'">
                                    <span class="px-2.5 py-1 rounded-full text-xs font-medium bg-danger/10 text-danger border border-danger/20">Stock Out</span>
                                </template>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold" :class="txn.transaction_type === 'IN' ? 'text-success' : 'text-danger'" x-text="(txn.transaction_type === 'IN' ? '+' : '-') + txn.quantity">
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600 dark:text-slate-400" x-text="txn.reference || '-'"></td>
                        </tr>
                    </template>
                    <template x-if="filteredTransactions.length === 0">
                        <tr>
                            <td colspan="5" class="px-6 py-4 text-center text-slate-500 dark:text-slate-400">No transactions found.</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('stockApp', () => ({
            tab: 'in',
            loading: true,
            submitting: false,
            products: [],
            transactions: [],
            filterType: '',
            
            inForm: {
                product_id: '',
                quantity: '',
                reference: '',
                notes: ''
            },
            
            outForm: {
                product_id: '',
                quantity: '',
                reference: '',
                notes: ''
            },

            productService: null,
            transactionService: null,

            async initData() {
                try {
                    this.loading = true;
                    const services = await import('/static/js/services/index.js');
                    this.productService = services.productService;
                    this.transactionService = services.transactionService;

                    const [productsRes, transactionsRes] = await Promise.all([
                        this.productService.getAll(),
                        this.transactionService.getAll()
                    ]);

                    this.products = productsRes.data || [];
                    this.transactions = transactionsRes.data || [];
                } catch (error) {
                    console.error('Failed to load initial data:', error);
                    alert('Error loading data: ' + error.message);
                } finally {
                    this.loading = false;
                }
            },

            get filteredTransactions() {
                if (!this.filterType) return this.transactions;
                return this.transactions.filter(t => t.transaction_type === this.filterType);
            },

            formatDate(dateStr) {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            },

            async submitTransaction(type) {
                try {
                    this.submitting = true;
                    
                    const form = type === 'IN' ? this.inForm : this.outForm;
                    const payload = { ...form };
                    
                    if (type === 'IN') {
                        // The backend transaction routes don't explicitly need transaction_type since the endpoint implies it,
                        // but we will use the specific endpoints or a general one.
                        // wait, transactionService.create posts to BASE_PATH ('/transactions').
                        // Let's look at transactionService.js: it does apiClient.post(BASE_PATH, data).
                        // BUT transactionRoutes.js uses `/transactions/in` and `/transactions/out`!
                        // Let's modify our logic to use apiClient directly or update transactionService.
                        // I will import apiClient directly here since transactionService is missing `addStock` and `removeStock`.
                        const apiClient = (await import('/static/js/services/apiClient.js')).default;
                        await apiClient.post(`/transactions/in`, payload);
                    } else {
                        const apiClient = (await import('/static/js/services/apiClient.js')).default;
                        await apiClient.post(`/transactions/out`, payload);
                    }

                    // Reset form
                    if (type === 'IN') {
                        this.inForm = { product_id: '', quantity: '', reference: '', notes: '' };
                    } else {
                        this.outForm = { product_id: '', quantity: '', reference: '', notes: '' };
                    }
                    
                    // Reload data to get updated stock and new transactions
                    await this.initData();
                    
                    // Add a nice toast or alert
                    alert(`Stock ${type} recorded successfully!`);
                    
                } catch (error) {
                    console.error('Transaction failed:', error);
                    alert('Error recording transaction: ' + error.message);
                } finally {
                    this.submitting = false;
                }
            }
        }));
    });
</script>
{% endblock %}
